<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Design System Builder Pro</title>

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="bg"></div>

<header>
  <div class="logo">🎨 Design System Builder</div>
  <p>Build modern UI tokens instantly</p>
</header>

<main class="container">

  <!-- COLORS -->
  <section class="card">
    <div class="card-header">
      <h2>Color Palette</h2>
      <button onclick="generateColors()">Generate</button>
    </div>
    <div class="palette" id="palette"></div>
  </section>

  <!-- SPACING -->
  <section class="card">
    <div class="card-header">
      <h2>Spacing Scale</h2>
      <button onclick="generateSpacing()">Generate</button>
    </div>
    <div id="spacing"></div>
  </section>

</main>

<footer>
  Built with ⚡ by Developer
</footer>

<script src="script.js"></script>
</body>
</html>
